<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EarnVerse — Watch, Follow, Read, Earn</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060f;--card:rgba(255,255,255,.05);--bd:rgba(255,255,255,.11);--tx:#e8ecff;--mu:#8a93b8;--c1:#00e5ff;--c2:#8b5cf6;--c3:#ff3da6;--ok:#2cff9a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(600px 400px at 12% 8%,rgba(139,92,246,.35),transparent),radial-gradient(500px 400px at 88% 18%,rgba(0,229,255,.22),transparent),radial-gradient(500px 400px at 50% 100%,rgba(255,61,166,.18),transparent)}
body::after{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(circle at 50% 25%,#000,transparent 72%);mask-image:radial-gradient(circle at 50% 25%,#000,transparent 72%)}
.wrap{max-width:1100px;margin:auto;padding:92px 18px 110px}
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 22px;background:rgba(5,6,15,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.logo{font-family:Orbitron,sans-serif;font-weight:800;letter-spacing:1px;font-size:19px;text-decoration:none;color:#fff;text-shadow:0 0 18px var(--c1)}
.links{display:flex;gap:4px;margin-left:auto}
a.l{color:var(--mu);text-decoration:none;padding:8px 13px;border-radius:10px;font-size:14px;transition:.2s}
a.l:hover,a.l.on{color:#fff;background:rgba(255,255,255,.09)}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);font-weight:700;color:var(--ok);font-size:14px;display:inline-block}
.btn{border:0;cursor:pointer;padding:12px 22px;border-radius:12px;font:700 14px 'Space Grotesk',sans-serif;color:#04060f;background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 0 24px rgba(0,229,255,.35);transition:.2s;text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 36px rgba(139,92,246,.6)}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid.w{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
h1{font-family:Orbitron,sans-serif;font-size:clamp(30px,6vw,58px);line-height:1.12;font-weight:800}
h2{font-family:Orbitron,sans-serif;font-size:21px;margin:34px 0 14px;font-weight:600}
.mu{color:var(--mu)}.sm{font-size:13px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:34px;align-items:center;padding:34px 0 10px}
.orb{position:relative;padding:26px;border-radius:24px;border:1px solid rgba(0,229,255,.35);background:linear-gradient(160deg,rgba(0,229,255,.1),rgba(139,92,246,.12));box-shadow:0 0 60px rgba(139,92,246,.3),inset 0 0 40px rgba(0,229,255,.08);animation:fl 5s ease-in-out infinite}
.orb .n{font-family:Orbitron,sans-serif;font-size:42px;font-weight:800;color:var(--ok);text-shadow:0 0 22px rgba(44,255,154,.55)}
.feed{margin-top:16px;display:grid;gap:8px;font-size:13px}
.feed div{display:flex;justify-content:space-between;padding:9px 12px;border-radius:10px;background:rgba(0,0,0,.3)}
@keyframes fl{50%{transform:translateY(-10px)}}
@media(prefers-reduced-motion:reduce){.orb{animation:none}}
input,select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--bd);background:rgba(0,0,0,.4);color:var(--tx);font:15px 'Space Grotesk',sans-serif;margin:6px 0 14px;outline:0}
input:focus,select:focus{border-color:var(--c1)}
select option{background:#0b0e1f}
label{font-size:13px;color:var(--mu)}
.row{display:flex;align-items:center;gap:14px}
.pb{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none;box-shadow:0 0 18px currentColor}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c1),var(--c3));transition:width .3s}
.big{font-family:Orbitron,sans-serif;font-size:28px;font-weight:800;margin-top:6px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:18px;backdrop-filter:blur(6px)}
.modal .card{max-width:560px;width:100%;max-height:85vh;overflow:auto;background:#0b0e1f}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;pointer-events:none;z-index:200;padding:12px 20px;border-radius:12px;background:#0b0e1f;border:1px solid var(--c1);box-shadow:0 0 28px rgba(0,229,255,.4);transition:.3s;font-size:14px}
#toast.on{opacity:1;transform:translateX(-50%)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:10px 8px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:500}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;background:rgba(255,200,0,.14);color:#ffd24a}
.fil{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fil button{cursor:pointer;padding:8px 16px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--mu);font:500 13px 'Space Grotesk',sans-serif}
.fil button.on{color:#04060f;background:linear-gradient(90deg,var(--c1),var(--c2));border-color:transparent}
details{padding:16px 18px;border:1px solid var(--bd);border-radius:14px;background:var(--card);margin-bottom:10px}
summary{cursor:pointer;font-weight:700}details p{margin-top:10px;color:var(--mu);line-height:1.7;font-size:14px}
.sb{padding:7px 12px;font-size:12px;border-radius:9px}
footer{text-align:center;color:var(--mu);font-size:13px;margin-top:50px;line-height:2}footer a{color:var(--c1);text-decoration:none;margin:0 8px}
@media(max-width:760px){
.hero{grid-template-columns:1fr}
.links{position:fixed;bottom:0;left:0;right:0;margin:0;justify-content:space-around;background:rgba(5,6,15,.94);backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
a.l{padding:8px 7px;font-size:12px}nav{padding:10px 14px}#au{margin-left:auto}.chip{padding:6px 10px}}
</style>
</head>
<body>
<nav>
  <a class="logo" href="#home">EARNVERSE</a>
  <div class="links">
    <a class="l" href="#home">Home</a><a class="l" href="#dash">Dashboard</a><a class="l" href="#tasks">Tasks</a>
    <a class="l" href="#blogs">Blogs</a><a class="l" href="#invite">Invite</a><a class="l" href="#wallet">Wallet</a><a class="l" href="#admin" id="adm" style="display:none">Admin</a>
  </div>
  <span class="chip" id="bal">$0.00</span>
  <a class="btn" id="au" href="#auth">Login</a>
</nav>
<main class="wrap" id="app"></main>
<div id="toast"></div>

<script>
/* ===== SETTINGS: apni values yahan badlein ===== */
const RATE=280;        // 1 USD = kitne PKR
const MIN=5;           // minimum withdraw (USD)
const REF_BONUS=0.5;   // har friend ka bonus (USD)
const REF_MIN_TASKS=3; // friend itne tasks kare tab hi bonus milta hai
const ADMIN_EMAIL='admin@earnverse.com'; // is email se signup karne par admin panel khulta hai (real site mein ye server rules se hona chahiye)
const PL={
  youtube:{n:'YouTube',c:'#ff1744',i:'YT'},
  instagram:{n:'Instagram',c:'#d62976',i:'IG'},
  tiktok:{n:'TikTok',c:'#00b8d4',i:'TT'},
  facebook:{n:'Facebook',c:'#1877f2',i:'FB'},
  blog:{n:'Blog',c:'#8b5cf6',i:'BL'}
};
/* Tasks: u = apni video / profile ka link lagayen, s = kitne second rukna hai, r = reward USD */
const TASKS=[
 {id:'y1',p:'youtube',t:'Watch: Tech Review 2026',r:.05,s:30,u:'https://www.youtube.com/'},
 {id:'y2',p:'youtube',t:'Watch & subscribe to our channel',r:.08,s:45,u:'https://www.youtube.com/'},
 {id:'i1',p:'instagram',t:'Follow our Instagram page',r:.04,s:15,u:'https://www.instagram.com/'},
 {id:'i2',p:'instagram',t:'Watch our latest Reel',r:.03,s:20,u:'https://www.instagram.com/'},
 {id:'t1',p:'tiktok',t:'Watch TikTok video',r:.03,s:20,u:'https://www.tiktok.com/'},
 {id:'t2',p:'tiktok',t:'Follow our TikTok account',r:.04,s:15,u:'https://www.tiktok.com/'},
 {id:'f1',p:'facebook',t:'Watch Facebook video',r:.03,s:25,u:'https://www.facebook.com/'},
 {id:'f2',p:'facebook',t:'Like & follow our Facebook page',r:.04,s:15,u:'https://www.facebook.com/'}
];
const BLOGS=[
 {id:'b1',t:'5 Smart Ways to Save Money Every Month',r:.03,s:20,x:'Track every expense for one week. Cut subscriptions you do not use. Set aside savings first, then spend what remains. Small habits repeated daily grow into real savings within a year.'},
 {id:'b2',t:'How Freelancers Get Their First Client',r:.04,s:25,x:'Pick one skill and one platform. Build three sample projects, write a clear offer, and message ten buyers a day. Consistency matters more than perfection when you are starting out.'},
 {id:'b3',t:'Beginner Guide to Staying Safe Online',r:.03,s:20,x:'Use a different password for every account and turn on two-step login. Never share OTP codes. Check the web address before you type any payment details.'}
];

/* ===== STATE ===== */
const K='earnverse_v1',$=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{user:null,bal:0,total:0,done:{},refs:0,hist:[],wd:[]};
S.queue=S.queue||[];S.custom=S.custom||[];S.streak=S.streak||0;
['y2','i1','t2','f2'].forEach(id=>TASKS.find(t=>t.id===id).rv=1); // follow/subscribe tasks manual review se pay hotay hain
S.custom.forEach(t=>TASKS.push(t));
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const usd=n=>'$'+n.toFixed(2);
const today=()=>new Date().toDateString();
const done=id=>S.done[id]===today();
const lbl=id=>S.queue.some(q=>q.id===id&&q.d===today()&&q.s==='Pending')?'In review':'Done';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400)}
function hdr(){$('#bal').textContent=usd(S.bal);$('#au').textContent=S.user?'Logout':'Login';$('#adm').style.display=S.user&&S.user.admin?'':'none'}
function pay(id,a,l){if(done(id))return;S.bal+=a;S.total+=a;S.done[id]=today();S.hist.push({d:today(),a,l});save();hdr();toast('+'+usd(a)+' added to your wallet')}

/* ===== COMPONENTS ===== */
const tcard=t=>`<div class="card row"><div class="pb" style="background:${PL[t.p].c};color:${PL[t.p].c}"><span style="color:#fff">${PL[t.p].i}</span></div>
<div style="flex:1"><b>${t.t}</b><div class="mu sm">${PL[t.p].n}, ${t.s} sec, <span style="color:var(--ok)">${usd(t.r)}</span></div></div>
<button class="btn" data-t="${t.id}" ${done(t.id)?'disabled':''}>${done(t.id)?lbl(t.id):'Start'}</button></div>`;
const bcard=b=>`<div class="card row"><div class="pb" style="background:${PL.blog.c};color:${PL.blog.c}"><span style="color:#fff">BL</span></div>
<div style="flex:1"><b>${b.t}</b><div class="mu sm">${b.s} sec read, <span style="color:var(--ok)">${usd(b.r)}</span></div></div>
<button class="btn" data-b="${b.id}" ${done(b.id)?'disabled':''}>${done(b.id)?'Done':'Read'}</button></div>`;
const stat=(l,v)=>`<div class="card"><div class="mu sm">${l}</div><div class="big">${v}</div></div>`;

/* ===== PAGES (sab pages ek hi file mein) ===== */
const P={
home:()=>`
<section class="hero"><div>
<h1>Watch, follow and read. Get paid in dollars.</h1>
<p class="mu" style="max-width:520px;margin:18px 0 26px;line-height:1.7">Complete short tasks on YouTube, Instagram, TikTok and Facebook, read blogs, invite friends, and withdraw to Easypaisa, JazzCash or your bank account.</p>
<a class="btn" href="#${S.user?'tasks':'auth'}">Start earning</a> <a class="btn g" href="#wallet">See payout methods</a></div>
<div class="orb"><div class="mu sm">Your wallet</div><div class="n" id="live">$0.00</div>
<div class="feed"><div><span>YouTube video watched</span><b style="color:var(--ok)">+$0.05</b></div><div><span>Instagram follow</span><b style="color:var(--ok)">+$0.04</b></div><div><span>Friend joined</span><b style="color:var(--ok)">+${usd(REF_BONUS)}</b></div></div></div></section>
<h2>Four ways to earn</h2>
<div class="grid">${Object.keys(PL).filter(k=>k!=='blog').map(k=>`<div class="card row"><div class="pb" style="background:${PL[k].c};color:${PL[k].c}"><span style="color:#fff">${PL[k].i}</span></div><div><b>${PL[k].n}</b><div class="mu sm">Daily tasks</div></div></div>`).join('')}
<div class="card row"><div class="pb" style="background:${PL.blog.c};color:${PL.blog.c}"><span style="color:#fff">BL</span></div><div><b>Blogs</b><div class="mu sm">Read and claim</div></div></div>
<div class="card row"><div class="pb" style="background:#00c853;color:#00c853"><span style="color:#fff">+1</span></div><div><b>Invite friends</b><div class="mu sm">${usd(REF_BONUS)} per friend</div></div></div></div>
<h2>How it works</h2>
<div class="grid"><div class="card"><b>1. Create your account</b><p class="mu sm" style="margin-top:6px">Sign up free in 20 seconds.</p></div>
<div class="card"><b>2. Finish tasks</b><p class="mu sm" style="margin-top:6px">Open the link, wait for the timer, claim your reward.</p></div>
<div class="card"><b>3. Withdraw</b><p class="mu sm" style="margin-top:6px">Request a payout from ${usd(MIN)}. Easypaisa, JazzCash or bank.</p></div></div>
<h2>Questions</h2>
<details><summary>How do I get paid?</summary><p>Request a withdrawal from ${usd(MIN)}. Payouts go to Easypaisa, JazzCash or your bank account after review.</p></details>
<details><summary>Why are some tasks reviewed?</summary><p>Follow and subscribe tasks are checked by our team before the reward is added. This keeps rewards fair for everyone.</p></details>
<details><summary>Can I have more than one account?</summary><p>No. One person, one account. Duplicate accounts are banned and their balance is removed.</p></details>
<details><summary>Where do the rewards come from?</summary><p>Rewards are funded by advertisers and partners who pay for views and follows. Edit this answer to match your real income source.</p></details>
<footer>EarnVerse. Rewards depend on available tasks and are subject to review.<br><a href="#legal">Terms</a><a href="#legal">Privacy</a><a href="#legal">Withdrawal policy</a><a href="#legal">Support</a></footer>`,

auth:()=>{const r=new URLSearchParams(location.search).get('ref')||'';return `
<div class="card" style="max-width:440px;margin:30px auto"><h2 style="margin-top:0">Create your account</h2>
<form onsubmit="return reg(event)"><label>Full name</label><input name="n" required maxlength="40" autocomplete="name">
<label>Email</label><input name="e" type="email" required autocomplete="email">
<label>Referral code (optional)</label><input name="r" value="${esc(r)}" maxlength="12">
<button class="btn" style="width:100%">Continue</button></form></div>`},

dash:()=>{const d7=[...Array(7)].map((_,i)=>{const dt=new Date(Date.now()-(6-i)*864e5).toDateString();return S.hist.filter(x=>x.d===dt).reduce((a,x)=>a+x.a,0)});
const mx=Math.max(...d7,.01),td=TASKS.filter(t=>done(t.id)).length+BLOGS.filter(b=>done(b.id)).length,lv=Math.floor(S.total/2)+1,pr=(S.total%2)/2*100;
return `<h2 style="margin-top:0">Welcome, ${esc(S.user.name)}</h2>
<div class="grid">${stat('Balance',usd(S.bal))}${stat('Total earned',usd(S.total))}${stat('Tasks done today',td)}${stat('Friends invited',S.refs)}</div>
<div class="card" style="margin-top:16px"><div class="row" style="justify-content:space-between"><b>Level ${lv}</b><span class="mu sm">Earn ${usd(2-(S.total%2))} more for the next level</span></div><div class="bar" style="margin-top:12px"><i style="width:${pr}%"></i></div></div>
<div class="card" style="margin-top:16px"><b>Earnings, last 7 days</b><div style="display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:16px">
${d7.map(v=>`<div title="${usd(v)}" style="flex:1;height:${Math.max(v/mx*100,4)}%;background:linear-gradient(var(--c1),var(--c2));border-radius:8px 8px 0 0;box-shadow:0 0 14px rgba(0,229,255,.3)"></div>`).join('')}</div></div>
<div class="card row" style="margin-top:16px;justify-content:space-between"><div><b>Daily bonus</b><div class="mu sm">Streak: ${S.streak} day${S.streak===1?'':'s'}. Claim every day to grow your bonus.</div></div><button class="btn" onclick="bonus()" ${S.lastBonus===today()?'disabled':''}>${S.lastBonus===today()?'Claimed':'Claim bonus'}</button></div>
<div style="margin-top:20px"><a class="btn" href="#tasks">Go to tasks</a></div>`},

tasks:()=>`<h2 style="margin-top:0">Daily tasks</h2><p class="mu sm" style="margin-bottom:14px">Tap Start, finish the action in the new tab, wait for the timer, then claim. Follow and subscribe tasks are paid after a quick review.</p>
<div class="fil">${['all','youtube','instagram','tiktok','facebook'].map(k=>`<button class="${FIL===k?'on':''}" onclick="FIL='${k}';view()">${k==='all'?'All':PL[k].n}</button>`).join('')}</div>
<div class="grid w">${TASKS.filter(t=>FIL==='all'||t.p===FIL).map(tcard).join('')}</div>`,

blogs:()=>`<h2 style="margin-top:0">Read and earn</h2><div class="grid w">${BLOGS.map(bcard).join('')}</div>`,

invite:()=>{const l=location.href.split('#')[0].split('?')[0]+'?ref='+S.user.code;return `
<h2 style="margin-top:0">Invite friends</h2>
<div class="card"><p class="mu">Earn <b style="color:var(--ok)">${usd(REF_BONUS)}</b> every time a friend joins with your link and completes ${REF_MIN_TASKS} tasks.</p>
<label style="display:block;margin-top:16px">Your link</label><input id="lnk" readonly value="${l}">
<div class="row"><button class="btn" onclick="cp()">Copy link</button><span class="mu sm">Code: <b>${S.user.code}</b></span></div></div>
<div class="grid" style="margin-top:16px">${stat('Friends joined',S.refs)}${stat('Referral earnings',usd(S.refs*REF_BONUS))}</div>`},

wallet:()=>`<h2 style="margin-top:0">Wallet</h2>
<div class="grid">${stat('Balance',usd(S.bal))}${stat('In PKR','Rs '+Math.round(S.bal*RATE).toLocaleString())}</div>
<div class="card" style="margin-top:16px"><b>Withdraw</b><p class="mu sm" style="margin:6px 0 14px">Minimum ${usd(MIN)}. Rate: $1 = Rs ${RATE}.</p>
<form onsubmit="return wd(event)"><label>Method</label><select name="m"><option>Easypaisa</option><option>JazzCash</option><option>Bank Account</option></select>
<label>Account title</label><input name="ttl" required maxlength="40">
<label>Mobile number (03XXXXXXXXX) or bank account / IBAN</label><input name="num" required maxlength="34">
<label>Amount (USD)</label><input name="amt" type="number" step="0.01" min="${MIN}" required>
<button class="btn" style="width:100%">Request withdrawal</button></form></div>
<div class="card" style="margin-top:16px;overflow-x:auto"><b>Withdrawal history</b>
${S.wd.length?`<table><tr><th>Date</th><th>Method</th><th>Amount</th><th>Status</th></tr>${S.wd.map(w=>`<tr><td>${w.d}</td><td>${w.m}</td><td>${usd(w.a)}</td><td><span class="tag">${w.s}</span></td></tr>`).join('')}</table>`:'<p class="mu sm" style="margin-top:10px">No withdrawals yet. Reach '+usd(MIN)+' and request your first payout.</p>'}</div>`,

legal:()=>`<h2 style="margin-top:0">Terms, privacy and withdrawals</h2><div class="card" style="line-height:1.7">
<b>Terms of use</b><p class="mu sm" style="margin:6px 0 18px">You must be 18 or older. One person may hold one account. Bots, fake accounts and VPN tricks used to claim rewards lead to a ban and loss of balance. Tasks and rewards may change.</p>
<b>Privacy</b><p class="mu sm" style="margin:6px 0 18px">We keep your name, email and activity only to run your account and prevent fraud. We do not sell your data. You can ask us to delete your account at any time.</p>
<b>Withdrawal policy</b><p class="mu sm" style="margin:6px 0 18px">Minimum ${usd(MIN)}. Requests are reviewed by hand and paid to Easypaisa, JazzCash or bank accounts in your own name. Rejected requests return to your balance.</p>
<b>Support</b><p class="mu sm" style="margin:6px 0 0">Email support@earnverse.com (replace with your own address).</p></div>`,

admin:()=>{
const paid=S.wd.filter(w=>w.s==='Paid').reduce((a,w)=>a+w.a,0),pw=S.wd.filter(w=>w.s==='Pending').length,pq=S.queue.filter(q=>q.s==='Pending').length;
const acts=(k,i)=>`<button class="btn sb" onclick="adm('${k}',${i},1)">${k==='w'?'Pay':'Approve'}</button> <button class="btn g sb" onclick="adm('${k}',${i},0)">Reject</button>`;
const wr=S.wd.map((w,i)=>`<tr><td>${w.d}</td><td>${w.m}<br><span class="mu sm">${esc(w.t||'')} ${esc(w.n||'')}</span></td><td>${usd(w.a)}</td><td><span class="tag">${w.s}</span></td><td>${w.s==='Pending'?acts('w',i):''}</td></tr>`).join('');
const qr=S.queue.map((q,i)=>`<tr><td>${q.d}</td><td>${q.t}</td><td>${usd(q.r)}</td><td><span class="tag">${q.s}</span></td><td>${q.s==='Pending'?acts('q',i):''}</td></tr>`).join('');
return `<h2 style="margin-top:0">Admin panel</h2>
<div class="grid">${stat('Total paid',usd(paid))}${stat('Pending withdrawals',pw)}${stat('Tasks to review',pq)}${stat('Live tasks',TASKS.length)}</div>
<div class="card" style="margin-top:16px;overflow-x:auto"><b>Withdrawal requests</b><table><tr><th>Date</th><th>Pay to</th><th>Amount</th><th>Status</th><th></th></tr>${wr||'<tr><td colspan="5" class="mu">No requests yet</td></tr>'}</table></div>
<div class="card" style="margin-top:16px;overflow-x:auto"><b>Task review queue</b><table><tr><th>Date</th><th>Task</th><th>Reward</th><th>Status</th><th></th></tr>${qr||'<tr><td colspan="5" class="mu">Nothing to review</td></tr>'}</table></div>
<div class="card" style="margin-top:16px"><b>Add a task</b>
<form onsubmit="return addT(event)" style="margin-top:12px"><label>Platform</label><select name="p">${Object.keys(PL).filter(k=>k!=='blog').map(k=>`<option value="${k}">${PL[k].n}</option>`).join('')}</select>
<label>Title</label><input name="tt" required maxlength="60"><label>Link (https://...)</label><input name="u" type="url" required>
<label>Reward (USD)</label><input name="r" type="number" step="0.01" min="0.01" required><label>Timer (seconds)</label><input name="s" type="number" min="10" value="20" required>
<label>Verification</label><select name="rv"><option value="0">Timer only</option><option value="1">Manual review</option></select>
<button class="btn" style="width:100%">Publish task</button></form>
${S.custom.map(t=>`<div class="row" style="justify-content:space-between;margin-top:12px"><span>${t.t}</span><button class="btn g sb" onclick="delT('${t.id}')">Delete</button></div>`).join('')}</div>`}
};
const AFTER={home(){let v=0;const el=$('#live');const iv=setInterval(()=>{if(!$('#live'))return clearInterval(iv);v+=.37;if(v>12.48)v=0;el.textContent=usd(v)},90)}};

/* ===== ACTIONS ===== */
function reg(ev){ev.preventDefault();const f=ev.target;
 S.user={name:f.n.value.trim(),email:f.e.value.trim(),admin:f.e.value.trim().toLowerCase()===ADMIN_EMAIL,code:'EV'+Math.random().toString(36).slice(2,8).toUpperCase()};
 save();hdr();toast('Account ready');location.hash='#dash';view();return false}
function cp(){const i=$('#lnk');i.select();try{navigator.clipboard.writeText(i.value)}catch(e){document.execCommand('copy')}toast('Link copied')}
function wd(ev){ev.preventDefault();const f=ev.target,a=parseFloat(f.amt.value),m=f.m.value,n=f.num.value.trim();
 if(!(a>=MIN))return toast('Minimum withdrawal is '+usd(MIN)),false;
 if(a>S.bal)return toast('Amount is more than your balance'),false;
 if(m!=='Bank Account'&&!/^03\d{9}$/.test(n))return toast('Enter a valid number like 03XXXXXXXXX'),false;
 if(m==='Bank Account'&&n.length<10)return toast('Enter a valid account number or IBAN'),false;
 S.bal-=a;S.wd.unshift({d:new Date().toLocaleDateString(),m,n,t:f.ttl.value.trim(),a,s:'Pending'});save();hdr();toast('Withdrawal request sent');view();return false}
const run={},VIS={};let LASTC=0,FIL='all';
function startTask(id){const t=TASKS.find(x=>x.id===id);if(done(id))return;
 if(run[id]&&Date.now()>=run[id]){
  if(!VIS[id])return toast('Finish the task in the new tab first, then come back');
  if(Date.now()-LASTC<4000)return toast('Slow down a little');
  LASTC=Date.now();delete run[id];
  if(t.rv){S.done[id]=today();S.queue.push({id,t:t.t,r:t.r,d:today(),s:'Pending'});save();toast('Sent for review. Reward is added once approved')}
  else pay(id,t.r,PL[t.p].n+' task');
  return view()}
 if(run[id])return;window.open(t.u,'_blank','noopener');delete VIS[id];run[id]=Date.now()+t.s*1000;tick()}
function tick(){document.querySelectorAll('[data-t]').forEach(b=>{const id=b.dataset.t,t=TASKS.find(x=>x.id===id);
 if(done(id)){b.textContent=lbl(id);b.disabled=true}else if(run[id]){const l=Math.ceil((run[id]-Date.now())/1000);b.textContent=l>0?l+'s':'Claim '+usd(t.r)}})}
setInterval(tick,500);
document.addEventListener('visibilitychange',()=>{if(document.hidden)Object.keys(run).forEach(k=>VIS[k]=1)});
function readBlog(id){const b=BLOGS.find(x=>x.id===id);if(done(id))return;const m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div class="card"><h2 style="margin-top:0">${b.t}</h2><p class="mu" style="line-height:1.75">${b.x}</p><div class="bar" style="margin:20px 0"><i id="bp"></i></div>
 <div class="row"><button class="btn" id="bc" disabled>Reading</button><button class="btn g" id="bx">Close</button></div></div>`;
 document.body.append(m);const end=Date.now()+b.s*1000;
 const iv=setInterval(()=>{const l=end-Date.now();$('#bp').style.width=Math.min(100,(1-l/(b.s*1000))*100)+'%';
  if(l<=0){clearInterval(iv);const c=$('#bc');c.disabled=false;c.textContent='Claim '+usd(b.r);c.onclick=()=>{pay(id,b.r,'Blog read');m.remove();view()}}},200);
 $('#bx').onclick=()=>{clearInterval(iv);m.remove()}}
document.addEventListener('click',ev=>{const a=ev.target.closest('[data-t]'),b=ev.target.closest('[data-b]');if(a)startTask(a.dataset.t);if(b)readBlog(b.dataset.b)});
$('#au').onclick=ev=>{if(S.user){ev.preventDefault();S.user=null;save();hdr();location.hash='#home';view()}};

function bonus(){if(S.lastBonus===today())return;S.streak=S.lastBonus===new Date(Date.now()-864e5).toDateString()?S.streak+1:1;S.lastBonus=today();
 const a=.01*Math.min(S.streak,7);S.bal+=a;S.total+=a;S.hist.push({d:today(),a,l:'Daily bonus'});save();hdr();toast('+'+usd(a)+' daily bonus');view()}
function adm(k,i,ok){if(k==='w'){const w=S.wd[i];w.s=ok?'Paid':'Rejected';if(!ok)S.bal+=w.a}
 else{const q=S.queue[i];q.s=ok?'Approved':'Rejected';if(ok){S.bal+=q.r;S.total+=q.r;S.hist.push({d:q.d,a:q.r,l:'Reviewed task'})}else S.done[q.id]=''}
 save();hdr();view()}
function addT(ev){ev.preventDefault();const f=ev.target,u=f.u.value.trim();if(!/^https:\/\//.test(u))return toast('Link must start with https://'),false;
 const t={id:'c'+Date.now(),p:f.p.value,t:esc(f.tt.value.trim()),r:parseFloat(f.r.value),s:parseInt(f.s.value,10),u,rv:+f.rv.value};
 S.custom.push(t);TASKS.push(t);save();toast('Task published');view();return false}
function delT(id){S.custom=S.custom.filter(t=>t.id!==id);const i=TASKS.findIndex(t=>t.id===id);if(i>-1)TASKS.splice(i,1);save();view()}

/* ===== ROUTER ===== */
function view(){let h=(location.hash||'#home').slice(1);if(!P[h])h='home';
 if(!S.user&&['dash','tasks','blogs','invite','wallet','admin'].includes(h))h='auth';
 if(h==='admin'&&!(S.user&&S.user.admin))h='home';
 document.querySelectorAll('a.l').forEach(a=>a.classList.toggle('on',a.hash==='#'+h));
 $('#app').innerHTML=P[h]();window.scrollTo(0,0);if(AFTER[h])AFTER[h]();tick()}
addEventListener('hashchange',view);hdr();view();
</script>
</body>
</html>
